services:
  db:
    container_name: agrosense-identity-db
    image: postgres:15.5-alpine
    environment:
      POSTGRES_USER: agrosense
      POSTGRES_PASSWORD: agrosense
      POSTGRES_DB: agrosense_identity
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5332:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrosense -d agrosense_identity"]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    container_name: agrosense-identity-api
    image: ${DOCKER_REGISTRY-}api
    build:
      context: .
      dockerfile: Api/Dockerfile
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=agrosense_identity;Username=agrosense;Password=agrosense
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db: