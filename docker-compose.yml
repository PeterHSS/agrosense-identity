services:
  api:
    image: ${DOCKER_REGISTRY-}api
    build:
      context: .
      dockerfile: Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_CONNECTION_STRING: "Host=postgres;Port=5432;Database=agrosense;Username=devuser;Password=devpassword"
  
  postgres:
    image: postgres:16.3
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrosense
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d agrosense"]
      interval: 5s
      timeout: 5s
      retries: 5 

volumes:
  postgres_data:
    driver: local
